[package]
name = "dramatis-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
dramatis-core = { workspace = true }
dramatis-gateway = { workspace = true }
dramatis-rag = { workspace = true }
dramatis-ingest = { workspace = true }
dramatis-machina = { workspace = true }
dramatis-stage = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
async-trait = { workspace = true }
regex = "1.10"
rhai = { version = "1.19", features = ["sync", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.17"
